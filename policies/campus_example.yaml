# EXAMPLE multi-stream site (proposal 1.3: colour-coded bins). Owner: WS3.
# Illustrates the configurable-policy mechanism; bin colours are placeholders.
site: campus_example
version: 0.1.0
description: Example campus with colour-coded paper, plastic and cans/glass bins.
uncertain_fallback: general_waste
abstain_source_url: https://www.cgs.gov.sg/recycleright/check-my-item/

bins:
  - key: paper_bin
    label: Paper bin
    channel: recycle
    colour: "#1F5FAD"
  - key: plastic_bin
    label: Plastic bin
    channel: recycle
    colour: "#F5821F"
  - key: cans_glass_bin
    label: Cans and glass bin
    channel: recycle
    colour: "#7A7A7A"
  - key: general_waste
    label: General waste
    channel: general_waste
    colour: "#3A3A3A"
  - key: e_waste_point
    label: E-waste collection point
    channel: e_waste
  - key: donation
    label: Donate or use another channel
    channel: donation

rules:
  - id: e_waste_items
    when: { materials: [e_waste] }
    then: e_waste_point
    reason: Electronics go to e-waste collection.
  - id: textiles
    when: { materials: [textile] }
    then: donation
    reason: Donate clothing or use another channel.
  - id: not_recyclable_materials
    when: { materials: [styrofoam, food_waste, other_general] }
    then: general_waste
    reason: This item is not recyclable here.
  - id: contaminated
    when: { conditions: [food_residue, leftover_liquid, item_inside] }
    then: general_waste
    reason: Contaminated items go to general waste.
    tip: Empty and rinse containers to recycle them.
  - id: clean_paper
    when: { materials: [paper, beverage_carton], conditions: [clean] }
    then: paper_bin
    reason: Clean paper and cartons go in the paper bin.
  - id: clean_plastic
    when: { materials: [plastic], conditions: [clean] }
    then: plastic_bin
    reason: Clean plastic goes in the plastic bin.
  - id: clean_cans_glass
    when: { materials: [metal, glass], conditions: [clean] }
    then: cans_glass_bin
    reason: Clean cans and glass go in the cans and glass bin.
