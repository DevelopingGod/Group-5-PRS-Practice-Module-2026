[project]
name = "binbuddy-contracts"
version = "0.1.0"
description = "Bin Buddy shared contracts (single source of truth for cross-workstream data)"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2.7,<3", "pyyaml>=6", "fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["binbuddy_contracts"]
