[project]
name = "bin-buddy"
version = "0.1.0"
description = "Bin Buddy: an adaptive, explainable recycling assistant (NUS-ISS PRS Practice Module, Group 5)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "binbuddy-contracts",
    "pydantic>=2.7,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=10",
    "numpy>=1.26",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "httpx>=0.27",
    "types-PyYAML>=6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contracts"]

[tool.uv.sources]
binbuddy-contracts = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["services/inference", "ml", "scripts"]
testpaths = ["contracts/tests", "services/inference/tests", "ml/tests", "scripts"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["binbuddy_contracts", "binbuddy_ml", "app", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["contracts", "services/inference", "ml", "scripts"]
explicit_package_bases = true
files = ["contracts", "services/inference", "ml", "scripts"]
exclude = ["apps/"]

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true
