[project]
name = "bin-buddy"
version = "0.1.0"
description = "Bin Buddy: an adaptive, explainable recycling assistant (NUS-ISS PRS Practice Module, Group 5)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "binbuddy-contracts",
    "pydantic>=2.7,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=10",
    "numpy>=1.26",
    "pyyaml>=6",
    "onnxruntime>=1.20",
    "huggingface-hub>=0.26",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "httpx>=0.27",
    "types-PyYAML>=6",
    "onnx>=1.17",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contracts"]

[tool.uv.sources]
binbuddy-contracts = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["services/inference", "ml", "scripts"]
testpaths = ["contracts/tests", "services/inference/tests", "ml/tests", "scripts"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Colab notebooks: conventional `import torch.nn.functional as F` / `transforms as T`, and long
# explanatory print lines.
"ml/notebooks/*.ipynb" = ["N812", "E501"]
# WS2 research scripts: long string literals and report text the formatter cannot wrap.
"scripts/ws2_*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["binbuddy_contracts", "binbuddy_ml", "app", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["contracts", "services/inference", "ml", "scripts"]
explicit_package_bases = true
files = ["contracts", "services/inference", "ml", "scripts"]
exclude = ["apps/"]

# WS2 research scripts run in Colab with sklearn/matplotlib/umap that CI does not install.
[[tool.mypy.overrides]]
module = [
    "ws2_audit_handoff",
    "ws2_blue_calibration",
    "ws2_check_validation_manifest",
    "ws2_cluster_embeddings",
    "ws2_cnn_baseline",
    "ws2_compare_validation",
    "ws2_confidence_fusion",
    "ws2_embedding_svm",
    "ws2_ensemble_v1",
    "ws2_evaluate_ood_pilot",
    "ws2_extract_features",
    "ws2_hybrid_selective",
    "ws2_hybrid_stack_v1",
    "ws2_make_validation_manifest",
    "ws2_matched_recall_final",
    "ws2_ood_baselines",
    "ws2_ood_local_thresholds",
    "ws2_predict_swin_val",
    "ws2_public_ensemble",
    "ws2_safety_novelty",
    "ws2_selective_safety",
    "ws2_stacking",
    "ws2_swin_ensemble_val",
    "ws2_train_svm",
    "ws2_umap_sources",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["PIL.*", "onnxruntime.*", "onnx.*"]
ignore_missing_imports = true
