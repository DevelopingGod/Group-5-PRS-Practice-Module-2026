# Render Blueprint for the Bin Buddy model API (WS1). Free web service built from the Dockerfile.
# Create it in the Render dashboard: New -> Blueprint -> this repository. Render asks for HF_TOKEN
# (a Hugging Face READ token for the private model repo); STATE_SECRET is generated by Render.
services:
  - type: web
    name: bin-buddy-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./services/inference/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: MODEL_REPO
        value: sankalp-indish/bin-buddy-vision
      - key: MODEL_REVISION
        value: v0.3-ensemble
      - key: HF_TOKEN
        sync: false
      - key: STATE_SECRET
        generateValue: true
